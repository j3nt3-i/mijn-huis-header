<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Laadanimatie vergelijken</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#111;color:#ddd;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;padding:16px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:18px;margin:0}
select,button{font:inherit;font-size:15px;color:#eee;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;padding:8px 12px;cursor:pointer}
.row{display:flex;gap:16px;flex-wrap:wrap}
figure{margin:0}
figcaption{margin:0 0 8px 4px;font-weight:600}
figcaption small{display:block;font-weight:400;color:#999;margin-top:2px}
iframe{width:430px;height:890px;border:0;border-radius:20px;background:#111}
</style>
<header>
  <h1>Laadanimatie vergelijken</h1>
  <select id="pick"></select>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="slow" checked> Vertraagd (3×)</label>
  <button id="play">▶ Speel beide af</button>
</header>
<div class="row">
  <figure><figcaption>Huidig<small>Alles verborgen tot het huis klaar is, daarna schuift alles in</small></figcaption><iframe id="a"></iframe></figure>
  <figure><figcaption>Apple-stijl<small>Balk en inhoud staan er meteen, alleen het huis verschijnt</small></figcaption><iframe id="b"></iframe></figure>
</div>
<script>
const slugs = ['sunny-day', 'cloudy-day', 'rainy-night', 'snowy-dusk', 'partlycloudy-night', 'windy-day', 'lightning-rainy-dusk'];
const pick = document.getElementById('pick');
for (const s of slugs) { const o = document.createElement('option'); o.textContent = s; pick.appendChild(o); }
const load = () => {
  const t = Date.now() + (document.getElementById('slow').checked ? '&slow=3' : '');
  document.getElementById('a').src = 'viewer.html?bare&style=cascade&t=' + t + '#' + pick.value;
  document.getElementById('b').src = 'viewer.html?bare&style=apple&t=' + t + '#' + pick.value;
};
pick.onchange = load;
document.getElementById('slow').onchange = load;
document.getElementById('play').onclick = load;
load();
</script></html>
